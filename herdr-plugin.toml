# The fleet minimap, the nav column that stands in for herdr's sidebar (tools/herdr.toml hides it): every space and
# agent to jump to, then the first mate, its crew and their agents fanned out like a chart. `qd setup` links this
# folder (herdr plugin link); tools/herdr.toml binds prefix+m (nav) and prefix+d (Captain's Deck in its own space) and
# puts the one-line version in the tab bar.
id = "qd.minimap"
name = "Fleet minimap"
version = "0.5.0"
min_herdr_version = "0.9.5"
description = "The nav column: spaces, agents and the first mate's crew fanned out like a chart, with a bonsai under it"
platforms = ["macos", "linux"]

# open the nav column once herdr has restored its spaces, since the sidebar starts hidden
[[startup]]
command = ["/usr/bin/env", "python3", "minimap.py", "--ensure"]

[[actions]]
id = "toggle"
title = "Focus the nav, or step back out of it"
contexts = ["workspace"]
command = ["/usr/bin/env", "python3", "minimap.py", "--toggle"]

[[actions]]
id = "deck"
title = "Captain's Deck in its own space"
contexts = ["workspace"]
command = ["/usr/bin/env", "python3", "minimap.py", "--deck"]

[[panes]]
id = "map"
title = "⛵ nav"
placement = "split"
command = ["/usr/bin/env", "python3", "minimap.py"]

# the bonsai under the nav column, which moves with it and keeps the height the captain gives it: the pixel-bonsai
# command, on PATH (https://github.com/KrishRVH/pixel-bonsai)
[[panes]]
id = "tree"
title = "🌳 bonsai"
placement = "split"
command = ["/usr/bin/env", "python3", "minimap.py", "--tree"]

# the same nav over a zoomed tab, where the column does not go
[[panes]]
id = "pick"
title = "⛵ nav"
placement = "popup"
width = 60
height = "85%"
command = ["/usr/bin/env", "python3", "minimap.py", "--popup"]

# closing a space or tab closes the nav column with it when it was there: open it again
[[events]]
on = "workspace.closed"
command = ["/usr/bin/env", "python3", "minimap.py", "--ensure"]

[[events]]
on = "tab.closed"
command = ["/usr/bin/env", "python3", "minimap.py", "--ensure"]
